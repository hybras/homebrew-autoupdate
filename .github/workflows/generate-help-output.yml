name: Generate --help output
# Generate `brew autoupdate --help output` for the README.md file
# Only for main: the job force-pushes one shared update branch, so running it
# for other branches would replace that branch with their unmerged help text.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-help-output:
    name: Generate --help output
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          debug: false

      - name: Trust preinstalled external taps
        run: brew trust aws/tap azure/bicep

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
            python-version: '3' 

      - name: Update README.md
        id: generate
        run: python .github/generate-help-output.py

      - name: Commit changes
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b update-readme-with-help-output
          git commit -am "Update README.md with --help output"
          git push origin update-readme-with-help-output --force
